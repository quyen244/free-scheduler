# Video re-up pipeline — F1 "shared ground".
#
# One composition so n8n and the services share ./data. n8n orchestrates and
# passes JSON; only services touch media. The architecture and delivery
# contracts are documented in ../reports/ and ../features/.
#
#   docker compose up -d
#
# This supersedes whisper-transcript-service/docker-compose.yml, which was
# removed: running both would fight over port 8000.

name: reup

x-data-volume: &data ./data:/data

services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      # Kept on all interfaces, as the pre-migration container had it.
      - "5678:5678"
    environment:
      TZ: Asia/Ho_Chi_Minh
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      WEBHOOK_URL: https://rexsantech.com/
      N8N_HOST: rexsantech.com
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 1
      # Services call back to http://n8n:5678/... over the compose network, so
      # n8n must build resume URLs with a hostname the services can resolve.
      # Left as the default here; F3 sets WEBHOOK_URL when callbacks land.
    volumes:
      # The pre-existing named volume, reused, never recreated. `external: true`
      # below is what guarantees that: without it, compose would make a fresh
      # empty volume named reup_n8n_data and n8n would come up blank.
      - n8n_data:/home/node/.n8n
      # Workflow JSON, version-controlled. Read-only: the editor is where
      # workflows change, and a two-way sync would just fight itself.
      #   docker compose exec n8n n8n import:workflow --input=/workflows/<f>.json
      - ./workflows:/workflows:ro
      - *data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [reup]

  # Owns acquisition: the only thing in the system that talks to YouTube.
  # Everything downstream reads what it wrote to data/<video_id>/.
  media-service:
    build: ./media-service
    container_name: media-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./media-service:/app
      # The pipeline database helper, shared by every service that writes a job
      # row. Mounted rather than copied so one edit reaches all of them.
      - ./shared:/app/shared
      - *data
    environment:
      DATA_DIR: /data
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [reup]

  # Owns OpenAI prompts, structured metadata validation, and selective retry.
  # Only this container receives OPENAI_API_KEY from the git-ignored root .env.
  metadata-service:
    build: ./metadata-service
    container_name: metadata-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./metadata-service:/app
      - ./shared:/app/shared
      - *data
    env_file:
      - ../.env
    environment:
      DATA_DIR: /data
      # Explicit product decision. This is configuration, not a credential;
      # OPENAI_API_KEY remains server-only in the root .env file.
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_INPUT_USD_PER_MILLION: "0.20"
      OPENAI_OUTPUT_USD_PER_MILLION: "1.20"
      METADATA_COST_WARNING_USD: "0.02"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8004/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [reup]

  # Vietnamese, from whatever Whisper detected. CPU only: the GPU is Whisper's,
  # and this stage runs once per video.
  translate-service:
    # CPU for now, and not for the reason the CPU Dockerfile gives. VRAM is not
    # the constraint: Whisper base at float16 measures ~231 MiB of the 6144 MiB
    # card, so the 1.13 GB translator fits beside it with room to spare.
    #
    # The constraint is architecture support. The newest prebuilt CUDA wheel of
    # llama-cpp-python is 0.3.13, and it does not know `hunyuan-dense`:
    #   unknown model architecture: 'hunyuan-dense'
    # That support arrived in the 0.3.16 this image compiles from source.
    # `Dockerfile.gpu` builds 0.3.16 against CUDA; point `dockerfile` there once
    # that image exists, and set LLAMA_GPU_LAYERS to -1.
    build:
      context: ./translate-service
      dockerfile: Dockerfile
    container_name: translate-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./translate-service:/app
      - ./shared:/app/shared
      - *data
    environment:
      TRANSLATE_MODEL: models/HY-MT1.5-1.8B-Q4_K_M.gguf
      DATA_DIR: /data
      # The second pass: re-translate only the segments whose Vietnamese is too
      # long for the slot the source gives them. 23 of 104 on the reference
      # run; the rest come out byte-identical to a single pass. `0` restores
      # that single pass exactly, which is what makes an A/B a one-variable
      # comparison. See reports/experiment-budget-ratio.md.
      TRANSLATE_BUDGET: "1"
      # Equal to render-service's TTS_MAX_RATIO on purpose, so the translator
      # and the voice stage agree on what "rushed" means. 1.25 was measured and
      # rejected: two fewer rushed segments, but it rewrites 15 that already fit
      # and it dropped meaning on one of them.
      TRANSLATE_TARGET_RATIO: "1.35"
      TRANSLATE_RETRIES: "2"
      # 0 while this service runs the CPU image. Set to -1 with the GPU image
      # to offload every layer. Leaving it set on a CPU build is harmless -
      # llama.cpp keeps the weights on the CPU - but it is also silent, which
      # is what _warn_if_not_offloaded in translator.py exists to say out loud.
      LLAMA_GPU_LAYERS: "0"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      # The weights load on the first job, not at startup, so this comes up
      # fast — unlike the Whisper service.
      start_period: 20s
    # Left in place for the swap to Dockerfile.gpu. A reserved device that the
    # process never opens costs nothing.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [reup]

  # Vietnamese voice and the ffmpeg composite. One service because both halves
  # have to agree on timing to the millisecond, and a boundary between them is
  # a boundary that agreement has to cross.
  render-service:
    # GPU. ZeroTTS on CUDA measured RTF 0.95 against 1.34 for the shipped CPU
    # session, and uses less system memory because the weights sit in VRAM.
    # Swap `dockerfile` back to `Dockerfile` and set TTS_PROVIDER=cpu to
    # return to the CPU build.
    build:
      context: ./render-service
      dockerfile: Dockerfile.gpu
    container_name: render-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - ./render-service:/app
      - ./shared:/app/shared
      # The ZeroTTS weights, ~900 MB, fetched once. Without this every rebuild
      # re-downloads them.
      - ./render-service/models:/models
      - *data
    environment:
      DATA_DIR: /data
      TTS_MODEL_DIR: /models
      TTS_VOICE: maichi
      DEFAULT_PRESET: bi-mat-bi-an
      # More threads is slower, measurably: one session at 4 threads runs at
      # RTF 1.34, at 2 threads 1.46, at 12 far worse. The graph is small
      # enough that synchronising costs more than the parallelism buys, so
      # concurrency comes from sessions instead - see TTS_WORKERS.
      TTS_THREADS: 2
      # Two sessions of two threads: RTF 1.16 against 1.34 for the single
      # 4-thread session, so 13 % off the longest stage in the pipeline, for
      # 1.2 GB more resident memory. Three sessions reach 1.12 but cost
      # 4.0 GB, which does not fit beside the 5.1 GB the render stage peaks
      # at. Numbers in reports/tts-spike.md.
      # One on CUDA, not the two the CPU pool uses. The sessions would share
      # one GPU rather than the idle cores the pool was built to fill, and
      # workers=1 is the only CUDA shape reports/tts-spike.md actually
      # measured: RTF 0.95. Raise it only with a measurement behind it.
      TTS_WORKERS: 1
      # Asked for by name so a missing CUDA runtime fails loudly. ONNX Runtime
      # builds a CPU session without complaining otherwise, and the stage just
      # runs slowly with nothing in the log to say why.
      TTS_PROVIDER: cuda
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      # The weights load on the first job, not at startup.
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [reup]

  whisper-transcript-service:
    build: ./whisper-transcript-service
    container_name: whisper-transcript-service
    restart: unless-stopped
    ports:
      # Localhost-only: a local dev tool, not reachable from other machines.
      # n8n reaches it as http://whisper-transcript-service:8000 instead.
      - "127.0.0.1:8000:8000"
    volumes:
      # Whole source tree, so uvicorn --reload picks up edits with no rebuild.
      - ./whisper-transcript-service:/app
      - ./shared:/app/shared
      - *data
    environment:
      WHISPER_MODEL: base
      MODEL_DIR: models
      DATA_DIR: /data
    depends_on:
      media-service:
        condition: service_healthy
    healthcheck:
      # The image has no curl; python3 is guaranteed to be there.
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 10s
      # Whisper loads its model at startup, so the first probe is slow.
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [reup]

volumes:
  n8n_data:
    external: true

networks:
  reup:
    driver: bridge
